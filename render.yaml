# Render blueprint for the WellCostIQ API.
# Apply via Render Dashboard -> Blueprints -> New Blueprint Instance (repo root).
# Secrets (sync: false) are entered in the Render dashboard, never committed here.
# Full walkthrough: docs/deployment.md
services:
  - type: web
    name: wellcosting-api
    runtime: docker
    plan: free # choose a paid instance for an always-on production service
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Deploy only after review and a passing Security workflow. The Dockerfile
    # entrypoint runs start-hosted.sh: migrate, unset DDL credential, bind PORT.
    autoDeploy: false
    healthCheckPath: /api/health
    envVars:
      # Python 3.12.16 is pinned by backend/Dockerfile, not Render's runtime.
      # Supabase Connect -> Session pooler: preserve generated host/user, use port 5432.
      # Runtime role: no superuser, no role/database/schema creation.
      - key: DATABASE_URL
        sync: false
      # Migration/schema-owner role; never the cluster administrator.
      - key: MIGRATION_DATABASE_URL
        sync: false
      # Generate with: openssl rand -hex 32  (unique per environment, at least 32 characters)
      - key: ENVIRONMENT
        value: "production"
      - key: SECRET_KEY
        sync: false
      # Vercel is HTTPS, so the refresh cookie must be Secure.
      - key: SECURE_COOKIES
        value: "true"
      # Refuse direct/rewritten requests carrying any other Host header. If the
      # service is renamed, update this and every Vercel rewrite together.
      - key: ALLOWED_HOSTS
        value: "wellcosting-api.onrender.com"
      # Render's edge is not a fixed address range, so the API treats the peer
      # connection as the client. Leave this blank unless Render provides static
      # proxy addresses for your plan; put distributed rate limits at the edge.
      - key: TRUSTED_PROXY_IPS
        sync: false
      # Token and password lifecycle: explicit production policy, not code defaults.
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: BACKUP_MAX_UPLOAD_MB
        value: "2048"
      # Entry checks on the daily cost sheet: arithmetic over the workspace's own
      # sheets, inside this service. No model and no outside call.
      - key: ENTRY_CHECKS_ENABLED
        value: "true"
      - key: ENTRY_CHECK_HISTORY_SHEETS
        value: "30"
      - key: PASSWORD_MAX_AGE_DAYS
        value: "90"
      - key: PASSWORD_EXPIRY_WARNING_DAYS
        value: "14"
      - key: PASSWORD_HISTORY_LIMIT
        value: "5"
      - key: FORCE_PASSWORD_CHANGE_ON_CREATE
        value: "true"
      - key: MAX_FAILED_LOGINS
        value: "5"
      - key: LOCKOUT_MINUTES
        value: "15"
      # Exact Vercel origin(s), comma-separated, e.g. https://wellcostiq.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_ADMIN_ON_STARTUP
        value: "true"
      # First-boot administrator seeding. Fill these once, then DELETE
      # SEED_ADMIN_PASSWORD from the dashboard after the first successful boot.
      - key: SEED_ORG_SLUG
        sync: false
      - key: SEED_ORG_NAME
        sync: false
      - key: SEED_OWNER_NAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
