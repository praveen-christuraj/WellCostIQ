name: Security and regression checks
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan full Git history for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: "true"

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-tools.txt
      - name: Install hash-verified application and test dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: Install isolated, hash-verified security tools
        run: |
          python -m venv "$RUNNER_TEMP/security-tools"
          "$RUNNER_TEMP/security-tools/bin/python" -m pip install --require-hashes -r backend/requirements-tools.txt
      - name: Audit production Python dependencies
        run: '"$RUNNER_TEMP/security-tools/bin/pip-audit" -r backend/requirements.txt -f json -o pip-audit-report.json'
      - name: Static security analysis
        run: '"$RUNNER_TEMP/security-tools/bin/bandit" -r backend/app -l'
      - name: Capture all static findings, including scoped reviewed suppressions
        if: always()
        run: '"$RUNNER_TEMP/security-tools/bin/bandit" -r backend/app -f json -o bandit-results.json --exit-zero --ignore-nosec'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-security-reports
          path: |
            pip-audit-report.json
            bandit-results.json
          retention-days: 14
      - run: sh -n backend/start-hosted.sh
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Audit all frontend dependencies
        run: npm audit --audit-level=low --json > npm-audit-report.json
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
          retention-days: 14
      - run: npm run test:security
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  containers:
    needs: [secret-scan, backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create disposable test credentials outside the checkout
        run: |
          python3 - <<'PY'
          import os, pathlib, secrets
          values = {key: secrets.token_hex(32) for key in ('POSTGRES_PASSWORD', 'DB_APP_PASSWORD', 'DB_MIGRATION_PASSWORD', 'SECRET_KEY')}
          values.update(APP_IMAGE_TAG='ci-' + os.environ['GITHUB_SHA'], BOOTSTRAP_ADMIN_ON_STARTUP='false')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'compose.env'
          path.write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          path.chmod(0o600)
          PY
      - name: Build pinned images
        run: docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" build
      - name: Scan API image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: wellcostiq-api:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Scan web image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: wellcostiq-web:ci-${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Start the isolated stack
        run: docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" up -d --wait --wait-timeout 180
      - name: Verify non-root runtimes and Nginx configuration
        run: |
          test "$(docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" exec -T api id -u)" -ne 0
          test "$(docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" exec -T web id -u)" -ne 0
          docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" exec -T web nginx -t
          curl --fail --silent http://127.0.0.1:8080/api/health
          curl --fail --silent --head http://127.0.0.1:8080/ | grep -i '^Strict-Transport-Security: max-age=31536000; includeSubDomains'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request TRACE http://127.0.0.1:8080/api/v1/auth/login)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Host: invalid.example' http://127.0.0.1:8080/)" = 000
      - name: Record built image identifiers
        run: |
          docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "wellcostiq-api:ci-$GITHUB_SHA" > api-image-identifier.txt
          docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "wellcostiq-web:ci-$GITHUB_SHA" > web-image-identifier.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: container-identifiers
          path: '*-image-identifier.txt'
          retention-days: 14
      - name: Stop the disposable stack without deleting volumes
        if: always()
        run: docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" down
