name: Security and regression checks
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-tools.txt
      - name: Install hash-verified application and test dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - name: Install isolated, hash-verified security tools
        run: |
          python -m venv "$RUNNER_TEMP/security-tools"
          "$RUNNER_TEMP/security-tools/bin/python" -m pip install --require-hashes -r backend/requirements-tools.txt
      - name: Audit production Python dependencies
        run: '"$RUNNER_TEMP/security-tools/bin/pip-audit" -r backend/requirements.txt -f json -o pip-audit-report.json'
      - name: Static security analysis
        run: '"$RUNNER_TEMP/security-tools/bin/bandit" -r backend/app -lll'
      - name: Capture all static findings for review
        if: always()
        run: '"$RUNNER_TEMP/security-tools/bin/bandit" -r backend/app -f json -o bandit-results.json --exit-zero'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-security-reports
          path: |
            pip-audit-report.json
            bandit-results.json
      - run: sh -n backend/start-hosted.sh
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Audit all frontend dependencies
        run: npm audit --audit-level=low --json > npm-audit-report.json
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
      - run: npm run test:security
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable test credentials outside the checkout
        run: |
          python3 - <<'PY'
          import os, pathlib, secrets
          values = {key: secrets.token_hex(32) for key in ('POSTGRES_PASSWORD', 'DB_APP_PASSWORD', 'DB_MIGRATION_PASSWORD', 'SECRET_KEY')}
          values.update(APP_IMAGE_TAG='ci-' + os.environ['GITHUB_SHA'], BOOTSTRAP_ADMIN_ON_STARTUP='false')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'compose.env'
          path.write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          path.chmod(0o600)
          PY
      - name: Build pinned images and start the isolated stack
        run: |
          docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" build
          docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" up -d --wait --wait-timeout 180
      - name: Verify non-root runtimes and Nginx configuration
        run: |
          test "$(docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" exec -T api id -u)" -ne 0
          test "$(docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" exec -T web id -u)" -ne 0
          docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" exec -T web nginx -t
          curl --fail --silent http://127.0.0.1:8080/api/health
      - name: Record built image identifiers
        run: |
          docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "wellcostiq-api:ci-$GITHUB_SHA" > api-image-identifier.txt
          docker image inspect --format '{{.Id}} {{json .RepoDigests}}' "wellcostiq-web:ci-$GITHUB_SHA" > web-image-identifier.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-identifiers
          path: '*-image-identifier.txt'
      - name: Stop the disposable stack
        if: always()
        run: docker compose -p cybersec-ci --env-file "$RUNNER_TEMP/compose.env" down
