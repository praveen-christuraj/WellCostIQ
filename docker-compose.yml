# Local / on-premise development stack.
#
# Production guidance is in docs/SECURITY_MANUAL.md: terminate TLS in front of the
# `web` service, set ENVIRONMENT=production, SECURE_COOKIES=true and exact HTTPS
# CORS_ORIGINS, and keep the database on a private network.
services:
  db:
    image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: wellcosting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database administrator password in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set a distinct application password in .env}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Set a distinct migration password in .env}
    volumes:
      # PostgreSQL 18 uses a versioned PGDATA under /var/lib/postgresql.
      # A NEW volume protects the old 16/17 volume: migrate by backup/restore.
      - postgres18_data:/var/lib/postgresql
      - ./scripts/postgres-init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [backend_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # Required by the official image to initialise/chown PGDATA and then drop
    # from root to the postgres user. No other capabilities are retained.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    # max_connections=100 plus background, health and autovacuum workers.
    pids_limit: 300
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wellcosting"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    image: wellcostiq-api:${APP_IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgresql+psycopg://wellcosting_migrator:${DB_MIGRATION_PASSWORD:?Set DB_MIGRATION_PASSWORD}@db:5432/wellcosting
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      BOOTSTRAP_ADMIN_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend_net]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # The image's hosted entrypoint migrates and starts Uvicorn; this one-shot
    # service deliberately runs only the existing Alembic command instead.
    entrypoint: ["alembic", "upgrade", "head"]
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: ./backend
    image: wellcostiq-api:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://wellcosting_app:${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}@db:5432/wellcosting
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      # Optional defence in depth behind nginx; hosted Render sets its exact name.
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      # nginx is the only client on this private network, so its forwarded address
      # is believable. Never widen this to a public range.
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.28.0.0/16}
      BACKUP_DIRECTORY: /app/backups
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-2048}
      # Entry checks on the daily cost sheet (statistics over the workspace's own
      # sheets; no model, no outside service). Set the first to false to hide them.
      ENTRY_CHECKS_ENABLED: ${ENTRY_CHECKS_ENABLED:-true}
      ENTRY_CHECK_HISTORY_SHEETS: ${ENTRY_CHECK_HISTORY_SHEETS:-30}
      ENTRY_CHECK_PROFILE_WINDOW_DAYS: ${ENTRY_CHECK_PROFILE_WINDOW_DAYS:-730}
      ENTRY_CHECK_PROFILE_MAX_AGE_HOURS: ${ENTRY_CHECK_PROFILE_MAX_AGE_HOURS:-24}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      # Password lifecycle: age in days, reuse depth and sign-in lockout.
      PASSWORD_MAX_AGE_DAYS: ${PASSWORD_MAX_AGE_DAYS:-90}
      PASSWORD_EXPIRY_WARNING_DAYS: ${PASSWORD_EXPIRY_WARNING_DAYS:-14}
      PASSWORD_HISTORY_LIMIT: ${PASSWORD_HISTORY_LIMIT:-5}
      MAX_FAILED_LOGINS: ${MAX_FAILED_LOGINS:-5}
      LOCKOUT_MINUTES: ${LOCKOUT_MINUTES:-15}
      FORCE_PASSWORD_CHANGE_ON_CREATE: ${FORCE_PASSWORD_CHANGE_ON_CREATE:-true}
      # First-run administrator: seeded from these values, otherwise
      # `docker compose exec -it api python -m app.seed`.
      BOOTSTRAP_ADMIN_ON_STARTUP: ${BOOTSTRAP_ADMIN_ON_STARTUP:-true}
      SEED_ORG_SLUG: ${SEED_ORG_SLUG:-}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-}
      SEED_OWNER_NAME: ${SEED_OWNER_NAME:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - backup_data:/app/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend_net]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Override the hosted migration/Uvicorn wrapper; Compose migrations have
    # already completed in the separate least-privilege migrate service.
    entrypoint: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build:
      context: ./frontend
      args:
        # Space-separated exact hostnames, without schemes or ports. Keep the
        # local names for health checks and add the public/fronting-proxy names.
        NGINX_SERVER_NAMES: ${NGINX_SERVER_NAMES:-localhost 127.0.0.1}
    image: wellcostiq-web:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      # Must stay loopback-only while nginx trusts edge_net for X-Forwarded-For.
      # Changing this to 0.0.0.0 would let direct clients spoof rate-limit keys.
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      api:
        condition: service_started
    networks: [backend_net, edge_net]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # No runtime internet egress for the database or API. A future SMTP/integration
  # facility needs a deliberate separate network, not a public backend_net.
  backend_net:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
  edge_net:
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  postgres18_data:
  backup_data:
